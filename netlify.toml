# Configuração de build para deploy automático no Netlify (a cada push)
[build]
  command = "pnpm run build:wasm && pnpm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  PNPM_VERSION = "9"

# Roteamento SPA: redireciona qualquer rota para index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200